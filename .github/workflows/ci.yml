name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Smoke-check the CLI
        run: |
          pug --version
          pug --help
      - name: Offline tests (no network, no Anthropic)
        run: pytest -q -m "not network and not anthropic"

  network:
    name: network tests (JSONPlaceholder, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Network tests (never Anthropic)
        run: pytest -q -m "network and not anthropic"
